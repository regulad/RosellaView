# Format and lint checks on every push and pull request (no Vega SDK needed).
#
# Copyright (C) 2026 Parker Wahle
# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm ci
      # The same checks as the pre-commit hook: Prettier, clang-format, ESLint.
      - run: npm run check
