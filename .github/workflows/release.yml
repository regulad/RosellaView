# On a build-number tag (3): the checks, then a production build with the
# pinned Vega SDK. The .vpkg files go to a GitHub Release, and the source maps
# and native debug files to Sentry. Uploading to the Appstore stays manual:
# its submission API doesn't take Vega packages yet.
#
# Run it by hand (workflow_dispatch) for a dry run: it builds and keeps the
# packages as a workflow artifact, with no release and no Sentry upload.
#
# Secrets: SENTRY_AUTH_TOKEN (a Sentry organization token with
# project:releases and project:write).
#
# Copyright (C) 2026 Parker Wahle
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

on:
  push:
    # The manifest's build-number, the only release identifier (Appstore).
    tags: ['[0-9]*']
  workflow_dispatch:

env:
  VEGA_SDK_VERSION: 2.0.13986

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    # The Vega SDK supports Ubuntu 20.04-24.04 on x86_64; the owner's builds
    # run on 22.04 (the vega distrobox), so CI does too.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # The SDK takes ~4 GB. Deleting the runner's preinstalled toolchains
      # costs about a minute, so only when space is actually short.
      - name: Free disk space if needed
        run: |
          df -h /
          if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 15 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tag matches the build number
        if: github.ref_type == 'tag'
        run: |
          build=$(sed -n 's/^build-number *= *\([0-9][0-9]*\).*/\1/p' app/manifest.toml)
          [ "${GITHUB_REF_NAME}" = "${build}" ] || { echo "tag ${GITHUB_REF_NAME} != build-number ${build}"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          # ~/.npm, for the npm installs build.sh runs in each package.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            native/package-lock.json
            native-view/package-lock.json

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq tar ca-certificates lz4 file libatomic1 make perl gcc libc6-dev pkg-config ccache

      # OpenSSL and FFmpeg build as CMake ExternalProjects, which skip any
      # step whose stamp exists: a cached build tree skips them entirely. The
      # key covers everything that changes them (the SDK, the submodule
      # commits, native/cmake/), so any of those changing rebuilds from scratch.
      - name: Third-party key
        id: third-party
        run: echo "hash=$(git submodule status --recursive | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: native/build
          key: native-build-armv7-${{ env.VEGA_SDK_VERSION }}-${{ steps.third-party.outputs.hash }}-${{ hashFiles('native/cmake/**', 'native/CMakeLists.txt') }}

      # Everything else compiles through ccache: a fresh checkout gives every
      # source a new mtime, so make recompiles it all, and ccache answers.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-armv7-${{ env.VEGA_SDK_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-armv7-${{ env.VEGA_SDK_VERSION }}-

      - name: Install the Vega SDK
        env:
          NONINTERACTIVE: 'true'
          SKIP_VVD_INSTALL: 'true'
        run: |
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | bash
          echo "$HOME/vega/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_UPLOAD: ${{ github.ref_type == 'tag' && '1' || '0' }}
          RV_CCACHE: '1'
          CCACHE_MAXSIZE: 1G
          # The SDK's compilers are found by content, not mtime (the SDK is
          # reinstalled every run).
          CCACHE_COMPILERCHECK: content
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache" # the cached path above
          vega -v
          ccache -z
          scripts/build.sh production
          ccache -s
          du -sh native/build native-view/build

      - name: Collect packages
        run: |
          mkdir -p out
          # Production builds are armv7 only, unsigned (scripts/build.sh).
          cp app/build/armv7-release/rosellaview_armv7.vpkg out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: rosellaview-vpkg
          path: out/*.vpkg

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # armv7 is the Fire TV Stick build, and the one Amazon's docs say to
          # submit; x86_64 and aarch64 are only for the Vega Virtual Device.
          gh release create "${GITHUB_REF_NAME}" out/rosellaview_armv7.vpkg --title "RosellaView build ${GITHUB_REF_NAME}" \
            --notes "Production build of ${GITHUB_SHA}. Submit rosellaview_armv7.vpkg in the Amazon Developer Console."
